<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Marco del monitor -->
  <rect x="16" y="20" width="96" height="64" rx="6" ry="6" fill="#00aaff" stroke="#000" stroke-width="2"></rect>
  
  <!-- Pantalla interna -->
  <rect x="20" y="24" width="88" height="56" rx="3" ry="3" fill="#ffffff"></rect>
  
  <!-- Indicadores de actividad tipo gráficos -->
  <rect x="28" y="60" width="8" height="20" fill="#00cc00" rx="1"></rect>
  <rect x="40" y="50" width="8" height="30" fill="#00cc00" rx="1"></rect>
  <rect x="52" y="44" width="8" height="36" fill="#00cc00" rx="1"></rect>
  <rect x="64" y="56" width="8" height="24" fill="#00cc00" rx="1"></rect>
  <rect x="76" y="48" width="8" height="32" fill="#00cc00" rx="1"></rect>
  
  <!-- Base del monitor -->
  <rect x="50" y="92" width="28" height="8" fill="#333" rx="2"></rect>
  
  <!-- Pie del monitor -->
  <rect x="56" y="100" width="16" height="8" fill="#555" rx="2"></rect>
</svg>